services:
  postgres:
    image: postgres:17-alpine
    container_name: tracedesk-postgres
    environment:
      POSTGRES_DB: tracedesk
      POSTGRES_USER: tracedesk
      POSTGRES_PASSWORD: tracedesk
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: elestio/minio:latest
    container_name: tracedesk-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgres_data:
  minio_data: