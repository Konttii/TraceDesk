<!DOCTYPE html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пароль изменён — TraceDesk</title>
</head>
<body style="margin:0;padding:24px;background-color:#f4f6f9;font-family:Arial,sans-serif;color:#1e293b;">
<div style="max-width:520px;margin:0 auto;background:#ffffff;border-radius:12px;padding:32px;border:1px solid #e2e8f0;">
    <h2 style="margin-top:0;color:#0f172a;">Пароль успешно изменён</h2>
    <p>Здравствуйте, <strong th:text="${firstName}">Пользователь</strong>!</p>
    <div style="margin:20px 0;padding:16px;background:#ecfdf5;border-left:4px solid #10b981;border-radius:6px;">
        <p style="margin:0;font-weight:bold;color:#065f46;">Пароль обновлён</p>
        <p style="margin:8px 0 0 0;color:#047857;">
            Пароль от вашей учётной записи <strong>TraceDesk</strong> (ИИН: <strong th:text="${iin}">000000000000</strong>) был успешно изменён.
        </p>
    </div>
    <p style="font-size:14px;color:#64748b;">
        Если это были не вы, немедленно обратитесь к администратору системы.
    </p>
</div>
</body>
</html>
