server:
  port: 8080

spring:
  application:
    name: tracedesk

  datasource:
    url: jdbc:postgresql://localhost:5432/tracedesk
    username: tracedesk
    password: tracedesk

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: tracedesk-attachments
